[workspace]
resolver = "2"
members = ["crates/picturelogic-core", "crates/picturelogic-render", "crates/picturelogic-kindle", "crates/picturelogic-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[workspace.dependencies]
picturelogic-core = { path = "crates/picturelogic-core" }
picturelogic-render = { path = "crates/picturelogic-render" }
primitive-app = { path = "../doannt-kindle-tools/crates/primitive-app" }
primitive-ui = { path = "../doannt-kindle-tools/crates/primitive-ui" }

[profile.release]
lto = true
codegen-units = 1
